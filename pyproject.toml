[project]
name = "stunt-double"
version = "0.1.0"
description = "Safety-first database agent rehearsal sandbox"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".python", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
